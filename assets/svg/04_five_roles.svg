<text x="1257" y="280" font-size="14" fill="#0B1F33" text-anchor="middle" font-weight="600">allowed wrong</text>
<text x="700" y="420" font-size="16" fill="#B42318" text-anchor="middle" font-weight="600">If every camera, LiDAR and microphone is deleted, x(t) still evolves.</text>
<text x="700" y="460" font-size="15" fill="#111827" text-anchor="middle" font-weight="500">That is the acceptance test for step 100.</text>
