<rect x="855" y="90" width="255" height="280" rx="10" fill="#C45C26" stroke="#111827" stroke-width="3"/>
<text x="982" y="160" font-size="18" fill="#F8FAFC" text-anchor="middle" font-weight="700">WORLD MODEL</text>
