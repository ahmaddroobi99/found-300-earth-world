<rect x="1130" y="90" width="255" height="280" rx="10" fill="#D4A017" stroke="#111827" stroke-width="3"/>
<text x="1257" y="160" font-size="18" fill="#0B1F33" text-anchor="middle" font-weight="700">PLANNER</text>
