<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" font-family="Georgia, Times, serif">
<rect width="1400" height="560" fill="#E8F1F8"/>
