<text x="705" y="290" font-size="14" fill="#D4A017" text-anchor="middle" font-weight="500">cloth, cars, robots</text>
<rect x="850" y="100" width="250" height="280" rx="10" fill="#C45C26" stroke="#111827" stroke-width="2"/>
<text x="975" y="180" font-size="20" fill="#F8FAFC" text-anchor="middle" font-weight="700">Body</text>
